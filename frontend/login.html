<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbbf24">
<title>Connexion — Simply Energy Home</title>
<link rel="icon" type="image/svg+xml" href="/icon-192.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
:root {
  --bg: #fcfaf6; --bg-elev: #ffffff; --ink: #1a1814; --ink-soft: #6b6358;
  --line: #e8e1d3; --accent: #f59e0b; --accent-deep: #b45309;
  --error: #b91c1c; --error-soft: #fee2e2;
  --shadow: 0 4px 16px rgba(26,24,20,.06), 0 16px 40px rgba(26,24,20,.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14110c; --bg-elev: #1d1914; --ink: #f4eedf; --ink-soft: #a89e8e;
    --line: #2a2520; --error-soft: #3a1414;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 90% -10%, rgba(245,158,11,.18) 0%, transparent 40%),
    radial-gradient(circle at -10% 90%, rgba(77,124,15,.10) 0%, transparent 35%);
  pointer-events: none; z-index: 0;
}
.card {
  position: relative; z-index: 1;
  background: var(--bg-elev);
  border-radius: 18px;
  padding: 40px;
  max-width: 400px;
  width: 100%;
  box-shadow: var(--shadow);
}
.brand {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 32px;
}
.logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(245,158,11,.35);
}
.brand h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 20px;
  letter-spacing: -0.01em;
}
h2 {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 26px;
  margin-bottom: 8px;
}
.lede {
  color: var(--ink-soft); font-size: 14px; margin-bottom: 28px;
}
.field { margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink);
  font: inherit; font-size: 15px;
  transition: border-color .15s, box-shadow .15s;
}
input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(245,158,11,.15);
}
button {
  width: 100%; padding: 12px; margin-top: 8px;
  background: var(--ink); color: var(--bg);
  border: none; border-radius: 8px;
  font: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer;
  transition: transform .15s;
}
button:hover { transform: translateY(-1px); }
button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.error {
  background: var(--error-soft); color: var(--error);
  padding: 10px 14px; border-radius: 8px;
  font-size: 14px;
  margin-bottom: 16px;
  display: none;
}
.error.show { display: block; }
.foot {
  margin-top: 20px; text-align: center;
  font-size: 12px; color: var(--ink-soft);
}
.foot a { color: var(--accent-deep); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">⚡</div>
    <h1>Simply Energy Home</h1>
  </div>
  <h2>Connexion</h2>
  <p class="lede">Entrez vos identifiants pour accéder au tableau de bord.</p>

  <div class="error" id="error"></div>

  <form onsubmit="return doLogin(event)">
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submitBtn">Se connecter</button>
  </form>

  <div class="foot">
    Mot de passe oublié ? <a href="#" onclick="alert('Créez un fichier vide reset.flag dans /data sur votre serveur, puis redémarrez. Le wizard reprendra.'); return false;">Comment récupérer ?</a>
  </div>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Connexion…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || 'Identifiants invalides');
    }
    window.location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
  return false;
}
// Vérifier si on est en mode bootstrap → rediriger vers /setup
fetch('/api/setup/status').then(r => r.json()).then(d => {
  if (d.first_boot) window.location.href = '/setup';
});
</script>
</body>
</html>
